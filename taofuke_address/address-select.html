<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>新建地址</title>
  <style>
    :root {
      --page-w: 393px;
      --page-h: 879px;
      --black: #101010;
      --text: #222;
      --muted: #c7c7c7;
      --line: #eeeeee;
      --soft: #f4f4f4;
      --red: #c82d35;
      --blue: #2f7edc;
      --save: #df9298;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #1b1b1b;
      color: var(--text);
    }

    body {
      display: grid;
      place-items: start center;
    }

    button,
    input {
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button { cursor: pointer; }

    .phone {
      position: relative;
      width: min(100vw, var(--page-w));
      height: var(--page-h);
      min-height: var(--page-h);
      overflow: hidden;
      background: #eee;
    }

    .view {
      position: absolute;
      inset: 0;
      display: none;
      background: #eee;
    }

    .view.active { display: block; }

    .wechat {
      height: 98px;
      background: var(--black);
      color: #f6f6f6;
    }

    .status {
      height: 42px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      padding: 0 30px 6px 38px;
      font-size: 17px;
      font-weight: 700;
      line-height: 1;
    }

    .status-left,
    .status-icons {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .muted-bell {
      position: relative;
      width: 14px;
      height: 15px;
      border: 2px solid #f6f6f6;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
      border-bottom: 0;
      transform: rotate(-15deg);
    }

    .muted-bell::before,
    .muted-bell::after {
      content: "";
      position: absolute;
      background: #f6f6f6;
    }

    .muted-bell::before {
      left: -4px;
      right: -4px;
      bottom: -4px;
      height: 2px;
      border-radius: 2px;
    }

    .muted-bell::after {
      width: 2px;
      height: 25px;
      top: -6px;
      left: 6px;
      transform: rotate(-45deg);
      border-radius: 2px;
    }

    .signal {
      display: inline-flex;
      align-items: flex-end;
      gap: 3px;
      height: 15px;
    }

    .signal span {
      width: 4px;
      border-radius: 2px;
      background: #f8f8f8;
    }

    .signal span:nth-child(1) { height: 5px; }
    .signal span:nth-child(2) { height: 8px; }
    .signal span:nth-child(3) { height: 11px; }
    .signal span:nth-child(4) { height: 14px; }

    .wifi {
      position: relative;
      width: 20px;
      height: 14px;
    }

    .wifi::before,
    .wifi::after {
      content: "";
      position: absolute;
      left: 50%;
      border: 3px solid #f8f8f8;
      border-color: #f8f8f8 transparent transparent transparent;
      border-radius: 50%;
      transform: translateX(-50%);
    }

    .wifi::before {
      top: 0;
      width: 24px;
      height: 24px;
    }

    .wifi::after {
      top: 6px;
      width: 13px;
      height: 13px;
    }

    .battery {
      min-width: 30px;
      height: 19px;
      padding: 1px 5px 0;
      border-radius: 7px;
      background: #eee;
      color: #111;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      line-height: 18px;
      position: relative;
    }

    .battery::after {
      content: "";
      position: absolute;
      right: -3px;
      top: 6px;
      width: 2px;
      height: 7px;
      border-radius: 0 2px 2px 0;
      background: #eee;
    }

    .webbar {
      height: 56px;
      display: grid;
      grid-template-columns: 62px 1fr 62px;
      align-items: center;
      padding-top: 4px;
    }

    .close {
      width: 44px;
      height: 44px;
      margin-left: 14px;
      position: relative;
    }

    .close::before,
    .close::after {
      content: "";
      position: absolute;
      left: 8px;
      top: 21px;
      width: 26px;
      height: 2px;
      border-radius: 2px;
      background: #d7d7d7;
    }

    .close::before { transform: rotate(45deg); }
    .close::after { transform: rotate(-45deg); }

    .brand {
      text-align: center;
      font-weight: 700;
      color: #dddddd;
      line-height: 1.05;
      font-size: 18px;
    }

    .brand span {
      display: block;
      margin-top: 4px;
      color: #8f8f8f;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .3px;
    }

    .more {
      display: flex;
      justify-content: center;
      gap: 5px;
    }

    .more span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #d4d4d4;
    }

    .titlebar {
      height: 45px;
      display: grid;
      grid-template-columns: 50px 1fr 50px;
      align-items: center;
      background: #fff;
      border-bottom: 1px solid #e7e7e7;
      box-shadow: 0 8px 10px rgba(0, 0, 0, .08);
      position: relative;
      z-index: 2;
    }

    .back {
      width: 44px;
      height: 44px;
      position: relative;
    }

    .back::before {
      content: "";
      position: absolute;
      left: 15px;
      top: 14px;
      width: 13px;
      height: 13px;
      border-left: 1.7px solid #222;
      border-bottom: 1.7px solid #222;
      transform: rotate(45deg);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: 0;
    }

    .form {
      background: #fff;
      position: relative;
      z-index: 1;
    }

    .row {
      min-height: 52px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding: 0 10px;
      color: var(--muted);
      font-size: 15px;
      letter-spacing: .1px;
    }

    .row input {
      width: 100%;
      outline: 0;
      color: #333;
      padding: 0;
    }

    .row input::placeholder {
      color: var(--muted);
      opacity: 1;
    }

    .address-row {
      justify-content: space-between;
      gap: 12px;
      position: relative;
      text-align: left;
      width: 100%;
    }

    .address-row::before {
      content: "获取精准地址";
      position: absolute;
      right: 11px;
      top: -22px;
      padding: 3px 8px 4px;
      border-radius: 2px;
      background: #555;
      color: #fff;
      font-size: 13px;
      white-space: nowrap;
      line-height: 1.25;
    }

    .address-row::after {
      content: "";
      position: absolute;
      right: 28px;
      top: 1px;
      border: 7px solid transparent;
      border-top-color: #555;
    }

    .address-row.has-address {
      min-height: 68px;
      color: #333;
    }

    .address-row.has-address::before,
    .address-row.has-address::after {
      display: none;
    }

    .address-text {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      line-height: 21px;
      text-overflow: ellipsis;
    }

    .locate {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #b8b8b8;
      font-size: 15px;
      padding-right: 4px;
      white-space: nowrap;
    }

    .pin {
      width: 15px;
      height: 15px;
      border: 1.6px solid #d1d1d1;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      position: relative;
    }

    .pin::before {
      content: "";
      position: absolute;
      left: 4px;
      top: 4px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #d1d1d1;
    }

    .paste-wrap {
      padding: 25px 9px 20px;
      background: #fff;
      border-top: 9px solid var(--soft);
      border-bottom: 10px solid var(--soft);
    }

    .paste-box {
      height: 141px;
      border: 1px solid #e6e6e6;
      position: relative;
      padding: 13px 10px;
      color: #c9c9c9;
      font-size: 14px;
      line-height: 1.75;
    }

    .paste-box p { margin: 0; }

    .recognize {
      position: absolute;
      right: 14px;
      bottom: 8px;
      width: 50px;
      height: 29px;
      border-radius: 3px;
      background: var(--red);
      color: rgba(255, 255, 255, .62);
      font-size: 13px;
    }

    .notice {
      height: 34px;
      display: flex;
      align-items: center;
      padding: 0 9px;
      margin: 0;
      color: #c2c2c2;
      background: #fff;
      font-size: 12px;
      border-bottom: 1px solid #f0f0f0;
    }

    .default-row {
      height: 95px;
      display: flex;
      justify-content: center;
      align-items: start;
      gap: 8px;
      padding-top: 27px;
      background: #eee;
      font-size: 15px;
      font-weight: 650;
      color: #222;
    }

    .radio {
      width: 21px;
      height: 21px;
      border-radius: 50%;
      border: 1.5px solid #c8c8c8;
      background: #fff;
    }

    .save {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 86px;
      height: 47px;
      background: var(--save);
      color: #fff;
      font-size: 15px;
      letter-spacing: 1px;
    }

    .browser-bottom {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 86px;
      background: #1d1d1d;
      display: flex;
      align-items: start;
      justify-content: center;
      gap: 72px;
      padding-top: 23px;
      z-index: 4;
    }

    .nav-arrow {
      width: 18px;
      height: 18px;
      border-left: 2px solid #9b9b9b;
      border-bottom: 2px solid #9b9b9b;
    }

    .nav-arrow.left { transform: rotate(45deg); }
    .nav-arrow.right {
      opacity: .42;
      transform: rotate(225deg);
    }

    .address-picker {
      background: #fff;
    }

    .search-panel {
      height: 74px;
      display: grid;
      grid-template-columns: 92px 1fr;
      align-items: center;
      gap: 0;
      padding: 10px 10px 11px;
      background: #fff;
      border-bottom: 1px solid #eee;
      position: relative;
      z-index: 3;
    }

    .city-trigger {
      height: 42px;
      display: flex;
      align-items: center;
      gap: 7px;
      color: #747474;
      font-size: 16px;
    }

    .down {
      width: 8px;
      height: 8px;
      border-right: 1.5px solid #777;
      border-bottom: 1.5px solid #777;
      transform: rotate(45deg) translateY(-3px);
    }

    .searchbox {
      height: 42px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      background: #f5f5f5;
      color: #bebebe;
      font-size: 15px;
    }

    .magnifier {
      width: 15px;
      height: 15px;
      border: 1.8px solid #222;
      border-radius: 50%;
      position: relative;
      flex: 0 0 auto;
    }

    .magnifier::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 2px;
      right: -6px;
      bottom: -4px;
      background: #222;
      transform: rotate(45deg);
      border-radius: 2px;
    }

    .map {
      height: 318px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(25deg, transparent 39%, rgba(196, 82, 88, .38) 40%, rgba(196, 82, 88, .38) 41%, transparent 42%),
        linear-gradient(118deg, transparent 43%, #fff 44%, #fff 47%, transparent 48%),
        linear-gradient(78deg, transparent 46%, #fff 47%, #fff 50%, transparent 51%),
        linear-gradient(154deg, transparent 48%, #fff 49%, #fff 52%, transparent 53%),
        linear-gradient(0deg, rgba(196, 224, 229, .72) 0 19%, transparent 20%),
        #f4f1e8;
    }

    .map::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(96deg, transparent 0 57%, rgba(224, 215, 232, .9) 58% 76%, transparent 77%),
        linear-gradient(18deg, rgba(196, 224, 229, .9) 0 18%, transparent 19%),
        linear-gradient(140deg, transparent 0 38%, rgba(248, 248, 248, .9) 39% 45%, transparent 46%),
        repeating-linear-gradient(28deg, transparent 0 22px, rgba(255, 255, 255, .75) 23px 27px);
      opacity: .9;
    }

    .map-label {
      position: absolute;
      z-index: 1;
      color: #888;
      font-size: 13px;
      line-height: 1.3;
      text-shadow: 0 1px 0 rgba(255, 255, 255, .8);
    }

    .park {
      left: 116px;
      top: 70px;
      color: #46aa5a;
      font-weight: 650;
    }

    .road-a {
      right: 25px;
      top: 62px;
      writing-mode: vertical-rl;
      letter-spacing: 2px;
    }

    .road-b {
      left: 228px;
      top: 170px;
      writing-mode: vertical-rl;
      letter-spacing: 2px;
    }

    .poi-a {
      left: 202px;
      top: 94px;
      color: #b5a9b4;
      font-size: 18px;
    }

    .poi-b {
      left: 205px;
      top: 145px;
      color: #777;
      font-size: 14px;
    }

    .selected-pin {
      position: absolute;
      z-index: 2;
      left: 186px;
      top: 102px;
      width: 28px;
      height: 28px;
      border-radius: 50% 50% 50% 0;
      background: #cf333c;
      transform: rotate(-45deg);
      box-shadow: 0 2px 5px rgba(0, 0, 0, .22);
    }

    .selected-pin::after {
      content: "";
      position: absolute;
      left: 7px;
      top: 7px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
    }

    .map-control {
      position: absolute;
      z-index: 2;
      right: 12px;
      bottom: 26px;
      width: 33px;
      height: 33px;
      border: 1px solid #d0d0d0;
      border-radius: 3px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .16);
    }

    .map-control::before {
      content: "";
      position: absolute;
      left: 8px;
      top: 8px;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #777;
      box-shadow: inset 0 0 0 3px #d8d8d8;
    }

    .place-list {
      height: 344px;
      margin: 0;
      padding: 0;
      list-style: none;
      overflow: auto;
      background: #fff;
    }

    .place-item {
      min-height: 76px;
      display: grid;
      grid-template-columns: 32px 1fr;
      align-items: start;
      padding: 21px 16px 14px 9px;
      border-bottom: 1px solid #f1f1f1;
      background: #fff;
      text-align: left;
      width: 100%;
    }

    .place-dot {
      width: 8px;
      height: 8px;
      margin-top: 7px;
      border-radius: 50%;
      background: #dedede;
    }

    .place-item.active .place-dot { background: #d42d35; }

    .place-name {
      display: block;
      color: #222;
      font-size: 16px;
      font-weight: 650;
      line-height: 1.3;
    }

    .place-address {
      display: block;
      margin-top: 6px;
      color: #888;
      font-size: 14px;
      line-height: 1.3;
    }

    .city-view {
      background: #fff;
    }

    .city-status {
      height: 58px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      padding: 0 45px 11px 68px;
      background: #fff;
      color: #000;
      font-size: 19px;
      font-weight: 700;
      line-height: 1;
    }

    .city-status .battery {
      width: 26px;
      min-width: 26px;
      height: 13px;
      padding: 0;
      border: 2px solid #000;
      border-radius: 3px;
      background: #fff;
      color: transparent;
    }

    .city-status .battery::before {
      content: "";
      position: absolute;
      inset: 2px 3px;
      background: #000;
      border-radius: 1px;
    }

    .city-status .battery::after {
      right: -5px;
      top: 3px;
      width: 2px;
      height: 5px;
      background: #000;
    }

    .city-title {
      height: 85px;
      display: grid;
      grid-template-columns: 64px 1fr 64px;
      align-items: center;
      background: #fff;
      border-bottom: 1px solid #e6e6e6;
    }

    .city-title h1 {
      font-size: 24px;
      font-weight: 700;
    }

    .city-mask {
      height: 52px;
      background: #878787;
    }

    .city-sheet {
      height: calc(100% - 195px);
      margin-top: -1px;
      border-radius: 7px 7px 0 0;
      background: #fff;
      overflow: hidden;
      position: relative;
    }

    .current-city {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      font-size: 16px;
      font-weight: 700;
    }

    .relocate {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--blue);
      font-size: 15px;
      font-weight: 500;
    }

    .target {
      width: 17px;
      height: 17px;
      border: 1.8px solid var(--blue);
      border-radius: 50%;
      position: relative;
    }

    .target::before,
    .target::after {
      content: "";
      position: absolute;
      background: var(--blue);
    }

    .target::before {
      left: 7px;
      top: -5px;
      width: 1.5px;
      height: 25px;
    }

    .target::after {
      left: -5px;
      top: 7px;
      width: 25px;
      height: 1.5px;
    }

    .city-search {
      height: 52px;
      display: flex;
      align-items: center;
      margin: 0 18px;
      padding: 0 18px;
      border-radius: 26px;
      background: #f7f7f7;
      color: #b7b7b7;
      font-size: 15px;
    }

    .hot-title {
      margin: 34px 18px 18px;
      font-size: 17px;
      font-weight: 700;
    }

    .hot-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px 16px;
      padding: 0 18px;
    }

    .hot-grid button {
      height: 29px;
      border-radius: 18px;
      background: #f7f7f7;
      color: #333;
      font-size: 15px;
    }

    .city-list {
      height: 372px;
      margin-top: 28px;
      overflow: hidden;
      border-top: 1px solid #f2f2f2;
      position: relative;
    }

    .letter-section {
      height: 42px;
      display: flex;
      align-items: center;
      padding-left: 18px;
      color: #999;
      font-size: 15px;
      border-bottom: 1px solid #f2f2f2;
    }

    .city-row {
      height: 51px;
      display: flex;
      align-items: center;
      padding-left: 18px;
      border-bottom: 1px solid #f2f2f2;
      color: #222;
      font-size: 16px;
    }

    .alphabet {
      position: absolute;
      right: 19px;
      top: 306px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      color: #333;
      font-size: 13px;
      line-height: 1;
    }
  </style>
</head>
<body>
  <main class="phone">
    <section class="view active" id="formView" aria-label="新建地址页面">
      <header class="wechat" aria-label="微信浏览器顶部栏">
        <div class="status">
          <div class="status-left">
            <span>17:17</span>
            <i class="muted-bell" aria-hidden="true"></i>
          </div>
          <div class="status-icons" aria-hidden="true">
            <span class="signal"><span></span><span></span><span></span><span></span></span>
            <span class="wifi"></span>
            <span class="battery">73</span>
          </div>
        </div>
        <div class="webbar">
          <button class="close" aria-label="关闭"></button>
          <div class="brand">淘福客 chj专用<span>m.quanmaigo.com</span></div>
          <div class="more" aria-hidden="true"><span></span><span></span><span></span></div>
        </div>
      </header>

      <section class="titlebar" aria-label="页面标题">
        <button class="back" aria-label="返回"></button>
        <h1>新建地址</h1>
        <span></span>
      </section>

      <section class="form" aria-label="地址表单">
        <label class="row">
          <input aria-label="收货人姓名" placeholder="请填写收货人姓名" />
        </label>
        <label class="row">
          <input aria-label="收货人手机号" placeholder="请填写收货人手机号" />
        </label>
        <button class="row address-row" id="addressTrigger" type="button">
          <span class="address-text" id="selectedAddress">请点击选择地址</span>
          <span class="locate"><i class="pin" aria-hidden="true"></i>定位</span>
        </button>
        <label class="row">
          <input aria-label="详细地址" placeholder="请输入门牌号，如1栋1单元101室" />
        </label>
      </section>

      <section class="paste-wrap" aria-label="地址智能识别">
        <div class="paste-box">
          <p>粘贴文本，自动识别姓名、电话、地址，例如，张三，13100000000，广东省深圳市南山区科兴科学园</p>
          <button class="recognize" type="button">识别</button>
        </div>

  <script>
    const formView = document.getElementById("formView");
    const addressView = document.getElementById("addressView");
    const cityView = document.getElementById("cityView");
    const addressTrigger = document.getElementById("addressTrigger");
    const selectedAddress = document.getElementById("selectedAddress");
    const pickerCity = document.getElementById("pickerCity");
    const currentCity = document.getElementById("currentCity");

    function show(view) {
      [formView, addressView, cityView].forEach((item) => item.classList.remove("active"));
      view.classList.add("active");
    }

    addressTrigger.addEventListener("click", () => show(addressView));
    document.getElementById("addressBack").addEventListener("click", () => show(formView));
    document.getElementById("cityTrigger").addEventListener("click", () => show(cityView));
    document.getElementById("cityBack").addEventListener("click", () => show(addressView));

    document.querySelectorAll(".place-item").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".place-item").forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        selectedAddress.textContent = button.dataset.full;
        addressTrigger.classList.add("has-address");
        show(formView);
      });
    });

    document.querySelectorAll("[data-city]").forEach((button) => {
      button.addEventListener("click", () => {
        const city = button.dataset.city;
        pickerCity.textContent = city;
        currentCity.textContent = city;
        show(addressView);
      });
    });
  </script>
