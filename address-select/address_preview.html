<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地址栏优化预览 (方案一)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .envelope-border {
            height: 4px;
            background: repeating-linear-gradient(
                -45deg,
                #e53935,
                #e53935 15px,
                transparent 15px,
                transparent 30px,
                #1e88e5 30px,
                #1e88e5 45px,
                transparent 45px,
                transparent 60px
            );
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#1a1a1a] flex justify-center font-sans">

    <!-- 微信 H5 容器 -->
    <div class="w-full max-w-md bg-white min-h-screen relative flex flex-col shadow-xl">
        
        <!-- 微信状态栏 & 导航栏 -->
        <div class="bg-[#1a1a1a] text-white flex justify-between items-center px-5 py-2 text-[12px] font-medium">
            <span>15:40</span>
            <div class="flex gap-1.5 items-center">
                <!-- 简单模拟信号和电量 -->
                <div class="flex items-end gap-[1px] h-3">
                    <div class="w-1 bg-white h-1.5"></div><div class="w-1 bg-white h-2"></div><div class="w-1 bg-white h-2.5"></div><div class="w-1 bg-white h-3"></div>
                </div>
                <div class="w-5 h-2.5 border border-white rounded-[2px] p-[1px] relative ml-1">
                    <div class="w-full h-full bg-white"></div>
                    <div class="absolute right-[-2px] top-1/2 -translate-y-1/2 w-[2px] h-1 bg-white rounded-r-[1px]"></div>
                </div>
            </div>
        </div>
        <div class="bg-[#1a1a1a] text-white flex items-center justify-between px-4 pb-3 pt-1">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6 text-gray-300">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
            <div class="text-center">
                <div class="text-[16px] font-medium leading-tight">淘福客 chj 专用</div>
                <div class="text-[10px] text-gray-400 mt-0.5">m.quanmaigo.com</div>
            </div>
            <div class="flex gap-1 items-center bg-white/10 rounded-full px-2.5 py-1.5 border border-white/20">
                <div class="w-1 h-1 bg-white rounded-full"></div>
                <div class="w-1 h-1 bg-white rounded-full"></div>
                <div class="w-1 h-1 bg-white rounded-full"></div>
            </div>
        </div>
        
        <!-- 确认订单标题栏 -->
        <div class="bg-white flex items-center justify-between px-4 py-3 border-b border-gray-100 flex-shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-gray-600">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
            </svg>
            <div class="text-[17px] font-medium text-[#333]">确认订单</div>
            <div class="w-5 h-5"></div>
        </div>

        <!-- 页面滚动内容区 -->
        <div class="flex-1 overflow-y-auto bg-gray-50 pb-[80px] hide-scrollbar relative">
            <!-- 顶部 Tab 模拟 (完全还原截图风格) -->
            <div class="flex px-4 pt-4 pb-2 bg-white border-b border-gray-100 gap-2">
            <div class="flex-1 py-2.5 text-center text-gray-700 bg-white border border-gray-200 rounded text-sm font-medium">
                到店自提
            </div>
            <div class="flex-1 py-2.5 text-center text-white bg-[#c53232] rounded text-sm font-medium shadow-sm">
                <div class="flex items-center justify-center gap-1.5">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 01-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 00-3.213-9.193 2.056 2.056 0 00-1.58-.86H14.25M16.5 18.75h-2.25m0-11.25v5.25m0-5.25H4.5M16.5 7.5h2.25m0 0a2.25 2.25 0 00-2.25-2.25H16.5M16.5 7.5v11.25m-2.25 0v-5.25" />
                    </svg>
                    同城配送
                </div>
            </div>
        </div>
        
        <!-- 信封边框 (红蓝相间) -->
        <div class="envelope-border w-full"></div>

        <!-- 地址区域 -->
        <div class="p-4 bg-white pb-5">
            <!-- 原有地址信息 -->
            <div class="flex items-center justify-between">
                <div class="flex items-start gap-2">
                    <!-- 定位图标 -->
                    <div class="mt-0.5 text-gray-400">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" />
                        </svg>
                    </div>
                    <div>
                        <div class="flex items-baseline gap-2 mb-1">
                            <span class="text-[#333] font-medium text-base">刘</span>
                            <span class="text-gray-500 text-sm">15076701713</span>
                        </div>
                        <div class="text-gray-500 text-xs leading-tight pr-4">
                            广东省深圳市龙华区民治街道 深圳 龙华 国际合...
                        </div>
                    </div>
                </div>
                <!-- 箭头 -->
                <div class="text-gray-300">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                    </svg>
                </div>
            </div>

            <!-- ========================================== -->
            <!-- 【核心新增】方案一：温和的内联提示条 -->
            <!-- ========================================== -->
            <div class="mt-3 bg-[#FFF4ED] rounded border border-[#FFE4D1] py-1 px-2 flex items-center justify-between pl-7 relative">
                
                <!-- 装饰线或小圆点，与上方定位图标对齐视觉 -->
                <div class="absolute left-3 top-1/2 -translate-y-1/2 text-[#F97316]">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4">
                        <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12zm8.706-1.442c1.146-.573 2.437.463 2.126 1.706l-.709 2.836.042-.02a.75.75 0 01.67 1.34l-.04.022c-1.147.573-2.438-.463-2.127-1.706l.71-2.836-.042.02a.75.75 0 11-.671-1.34l.041-.022zM12 9a.75.75 0 100-1.5.75.75 0 000 1.5z" clip-rule="evenodd" />
                    </svg>
                </div>

                <div class="text-[#F97316] text-[10px] font-medium whitespace-nowrap overflow-hidden text-ellipsis flex-1 pr-2">
                    当前地址为手动填写，建议改为地图选点更准确哦
                </div>
                
                <button class="bg-[#F97316] text-white text-[11px] px-3 py-0.5 rounded-full whitespace-nowrap shadow-sm active:bg-[#EA580C] font-medium transition-colors">
                    去修改
                </button>
            </div>
            <!-- ========================================== -->

        </div>
        
        <!-- 分割区 -->
        <div class="h-2 bg-gray-50"></div>
        
        <!-- 配送时间模拟 -->
        <div class="px-4 py-3 bg-white flex justify-between items-center">
            <span class="text-[#333] text-[15px]">配送时间</span>
            <div class="flex items-center text-gray-400 text-sm gap-1">
                <span>请选择</span>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                </svg>
            </div>
        </div>

        <div class="h-2 bg-gray-50"></div>

        <!-- 本地生活 -->
        <div class="px-4 py-3 bg-white">
            <div class="flex justify-between items-center mb-4">
                <span class="text-[#333] text-[15px] font-medium">本地生活</span>
                <span class="text-gray-400 text-sm">免运费</span>
            </div>
            <div class="flex gap-3 mb-4">
                <!-- 商品图 -->
                <div class="w-16 h-16 bg-gray-50 border border-gray-100 rounded flex-shrink-0 flex justify-center items-center overflow-hidden">
                   <div class="text-[30px]">🍰</div>
                </div>
                <div class="flex-1 flex flex-col justify-between">
                    <div>
                        <div class="text-[#333] text-[14px] leading-tight">【布歌东京】榛子奶油蛋糕</div>
                        <div class="text-gray-400 text-xs mt-1">6英寸</div>
                    </div>
                    <div class="flex justify-between items-end mt-2">
                        <span class="text-[#c53232] text-sm font-medium">198美元</span>
                        <span class="text-gray-300 text-xs">x1</span>
                    </div>
                </div>
            </div>
            
            <div class="border-t border-gray-50 pt-3 pb-1 flex justify-between items-center">
                <span class="text-[#333] text-[14px]">配件</span>
                <div class="flex items-center text-gray-400 text-[13px] gap-1">
                    <span>请选择</span>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3.5 h-3.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                    </svg>
                </div>
            </div>
            
            <div class="border-t border-gray-50 pt-3 mt-2 pb-1">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-gray-500 text-[13px]">商品金额</span>
                    <span class="text-[#c53232] text-[14px]">198.00美元</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-500 text-[13px]">运费</span>
                    <span class="text-[#c53232] text-[14px]">0.00美元</span>
                </div>
            </div>
        </div>

        <div class="h-2 bg-gray-50"></div>

        <!-- 优惠券 -->
        <div class="px-4 py-3 bg-white flex justify-between items-center">
            <div class="flex items-center gap-1.5">
                <div class="text-[#c53232] border border-[#c53232] rounded px-0.5 text-[10px] leading-none py-0.5">券</div>
                <span class="text-[#333] text-[14px]">来福优选券</span>
            </div>
            <div class="flex items-center text-gray-400 text-[13px] gap-1">
                <span>5张可用</span>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3.5 h-3.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                </svg>
            </div>
        </div>
        
        <div class="h-20 bg-gray-50 border-b border-gray-200"></div> <!-- 底部留白以防遮挡 -->

        <!-- 底部提交订单栏 -->
        <div class="absolute bottom-0 left-0 w-full bg-white flex items-center justify-end z-10 border-t border-gray-100 shadow-[0_-2px_10px_rgba(0,0,0,0.02)]">
            <div class="flex items-center mr-4">
                <span class="text-[#333] text-sm mr-2">实付</span>
                <span class="text-[#c53232] text-[16px] font-medium">198.00美元</span>
            </div>
            <button class="bg-[#c53232] text-white px-8 py-3.5 font-medium text-[15px] h-full flex items-center justify-center">
                提交订单
            </button>
        </div>

    </div>

</body>
</html>
