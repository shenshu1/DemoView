<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>新建地址</title>
  <style>
    :root {
      --page-w: 393px;
      --page-h: 879px;
      --black: #101010;
      --text: #222;
      --muted: #c7c7c7;
      --line: #eeeeee;
      --soft: #f4f4f4;
      --red: #c82d35;
      --blue: #2f7edc;
      --save: #df9298;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #1b1b1b;
      color: var(--text);
    }

    body {
      display: grid;
      place-items: start center;
    }

    button,
    input {
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button { cursor: pointer; }

    .phone {
      position: relative;
      width: min(100vw, var(--page-w));
      height: var(--page-h);
      min-height: var(--page-h);
      overflow: hidden;
      background: #eee;
    }

    .view {
      position: absolute;
      inset: 0;
      display: none;
      background: #eee;
    }

    .view.active { display: block; }

    .wechat {
      height: 98px;
      background: var(--black);
      color: #f6f6f6;
    }

    .status {
      height: 42px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      padding: 0 30px 6px 38px;
      font-size: 17px;
      font-weight: 700;
      line-height: 1;
    }

    .status-left,
    .status-icons {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .muted-bell {
      position: relative;
      width: 14px;
      height: 15px;
      border: 2px solid #f6f6f6;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
      border-bottom: 0;
      transform: rotate(-15deg);
    }

    .muted-bell::before,
    .muted-bell::after {
      content: "";
      position: absolute;
      background: #f6f6f6;
    }

    .muted-bell::before {
      left: -4px;
      right: -4px;
      bottom: -4px;
      height: 2px;
      border-radius: 2px;
    }

    .muted-bell::after {
      width: 2px;
      height: 25px;
      top: -6px;
      left: 6px;
      transform: rotate(-45deg);
      border-radius: 2px;
    }

    .signal {
      display: inline-flex;
      align-items: flex-end;
      gap: 3px;
      height: 15px;
    }

    .signal span {
      width: 4px;
      border-radius: 2px;
      background: #f8f8f8;
    }

    .signal span:nth-child(1) { height: 5px; }
    .signal span:nth-child(2) { height: 8px; }
    .signal span:nth-child(3) { height: 11px; }
    .signal span:nth-child(4) { height: 14px; }

    .wifi {
      position: relative;
      width: 20px;
      height: 14px;
    }

    .wifi::before,
    .wifi::after {
      content: "";
      position: absolute;
      left: 50%;
      border: 3px solid #f8f8f8;
      border-color: #f8f8f8 transparent transparent transparent;
      border-radius: 50%;
      transform: translateX(-50%);
    }

    .wifi::before {
      top: 0;
      width: 24px;
      height: 24px;
    }

    .wifi::after {
      top: 6px;
      width: 13px;
      height: 13px;
    }

    .battery {
      min-width: 30px;
      height: 19px;
      padding: 1px 5px 0;
      border-radius: 7px;
      background: #eee;
      color: #111;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      line-height: 18px;
      position: relative;
    }

    .battery::after {
      content: "";
      position: absolute;
      right: -3px;
      top: 6px;
      width: 2px;
      height: 7px;
      border-radius: 0 2px 2px 0;
      background: #eee;
    }

    .webbar {
      height: 56px;
      display: grid;
      grid-template-columns: 62px 1fr 62px;
      align-items: center;
      padding-top: 4px;
    }

    .close {
      width: 44px;
      height: 44px;
      margin-left: 14px;
      position: relative;
    }

    .close::before,
    .close::after {
      content: "";
      position: absolute;
      left: 8px;
      top: 21px;
      width: 26px;
      height: 2px;
      border-radius: 2px;
      background: #d7d7d7;
    }

    .close::before { transform: rotate(45deg); }
    .close::after { transform: rotate(-45deg); }

    .brand {
      text-align: center;
      font-weight: 700;
      color: #dddddd;
      line-height: 1.05;
      font-size: 18px;
    }

    .brand span {
      display: block;
      margin-top: 4px;
      color: #8f8f8f;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .3px;
    }

    .more {
      display: flex;
      justify-content: center;
      gap: 5px;
    }

    .more span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #d4d4d4;
    }

    .titlebar {
      height: 45px;
      display: grid;
      grid-template-columns: 50px 1fr 50px;
      align-items: center;
      background: #fff;
      border-bottom: 1px solid #e7e7e7;
      box-shadow: 0 8px 10px rgba(0, 0, 0, .08);
      position: relative;
      z-index: 2;
    }

    .back {
      width: 44px;
      height: 44px;
      position: relative;
    }

    .back::before {
      content: "";
      position: absolute;
      left: 15px;
      top: 14px;
      width: 13px;
      height: 13px;
      border-left: 1.7px solid #222;
      border-bottom: 1.7px solid #222;
      transform: rotate(45deg);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: 0;
    }

    .address-mode-card {
      background: #fff;
      margin: 12px 10px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .06);
    }

    .mode-tabs {
      display: flex;
      position: relative;
    }

    .mode-tab {
      flex: 1;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 500;
      color: #666;
      position: relative;
      background: #f8f8f8;
      transition: all .2s;
    }

    .mode-tab:first-child {
      border-radius: 0;
    }

    .mode-tab.active {
      color: #222;
      font-weight: 600;
      background: #fff;
    }

    .mode-tab.active::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 28px;
      height: 2px;
      border-radius: 1px;
      background: var(--red);
    }

    /* 地图选取标签小红气泡 */
    .mode-badge {
      display: inline-block;
      position: relative;
      top: -6px;
      margin-left: 2px;
      padding: 1px 5px;
      font-size: 10px;
      font-weight: 500;
      color: #fff;
      background: var(--red);
      border-radius: 6px;
      line-height: 1.4;
    }

    .mode-content {
      display: none;
      padding: 0;
    }

    .mode-content.active {
      display: block;
    }

    /* 手动填写模式 */
    .region-picker {
      display: flex;
      align-items: center;
      min-height: 52px;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      justify-content: space-between;
    }

    .region-text {
      flex: 1;
      color: var(--muted);
      font-size: 15px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .region-text.selected {
      color: #333;
    }

    .region-locate {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--blue);
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
      margin-left: 8px;
    }

    .locate-pin {
      width: 14px;
      height: 14px;
      border: 1.5px solid var(--blue);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      position: relative;
    }

    .locate-pin::before {
      content: "";
      position: absolute;
      left: 3px;
      top: 3px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--blue);
    }

    .detail-input {
      min-height: 52px;
      display: flex;
      align-items: center;
      padding: 0 14px;
    }

    .detail-input input {
      width: 100%;
      height: 40px;
      border: 0;
      background: transparent;
      color: #333;
      font-size: 15px;
      outline: 0;
    }

    .detail-input input::placeholder {
      color: var(--muted);
    }

    /* 地区选择弹窗 */
    .region-sheet-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: none;
      background: rgba(0,0,0,.4);
    }

    .region-sheet-overlay.active {
      display: block;
    }

    .region-sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 50%;
      background: #fff;
      border-radius: 12px 12px 0 0;
      display: flex;
      flex-direction: column;
    }

    .region-sheet-header {
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid #eee;
      flex-shrink: 0;
    }

    .region-sheet-header .cancel {
      color: #999;
      font-size: 15px;
    }

    .region-sheet-header .confirm {
      color: var(--red);
      font-size: 15px;
      font-weight: 600;
    }

    .region-sheet-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .region-column {
      flex: 1;
      overflow-y: auto;
      background: #f8f8f8;
    }

    .region-column:nth-child(2) {
      background: #fff;
    }

    .region-column:nth-child(3) {
      background: #fff;
    }

    .region-option {
      height: 44px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-size: 15px;
      color: #333;
      background: #f8f8f8;
    }

    .region-option.active {
      background: #fff;
      color: var(--red);
      font-weight: 600;
    }

    .region-column:nth-child(2) .region-option {
      background: #fff;
    }

    .region-column:nth-child(3) .region-option {
      background: #fff;
    }

    /* 地图选点模式 */
    .map-select-trigger {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 1px solid var(--line);
      position: relative;
      overflow: hidden;
    }

    /* 虚拟地图渐变背景 */
    .map-select-trigger::before {
      content: "";
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 140px;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(232,244,232,0.6) 30%, rgba(200,230,200,0.4) 100%);
      pointer-events: none;
    }

    /* 地图展开icon */
    .map-icon {
      width: 24px;
      height: 20px;
      position: relative;
      z-index: 1;
      flex-shrink: 0;
      margin-left: 6px;
    }

    /* 地图纸张 - 左侧页 */
    .map-icon::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 10px;
      height: 18px;
      border: 2px solid #999;
      border-right: 0;
      border-radius: 2px 0 0 2px;
      transform: skewY(-8deg);
    }

    /* 地图纸张 - 右侧页 */
    .map-icon::after {
      content: "";
      position: absolute;
      right: 0;
      top: 2px;
      width: 10px;
      height: 18px;
      border: 2px solid #999;
      border-left: 0;
      border-radius: 0 2px 2px 0;
      transform: skewY(8deg);
    }

    /* 定位pin在地图中央 */
    .map-icon-pin {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -60%);
      width: 10px;
      height: 10px;
      background: var(--red);
      border-radius: 50% 50% 50% 0;
      transform: translate(-50%, -60%) rotate(-45deg);
      z-index: 2;
    }

    .map-icon-pin::after {
      content: "";
      position: absolute;
      left: 3px;
      top: 3px;
      width: 4px;
      height: 4px;
      background: #fff;
      border-radius: 50%;
    }

    .map-select-text {
      flex: 1;
      min-width: 0;
      position: relative;
      z-index: 1;
    }

    .map-select-placeholder {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.4;
    }

    .map-result-name {
      display: block;
      color: #222;
      font-size: 16px;
      font-weight: 650;
      line-height: 1.3;
      word-break: break-all;
    }

    .map-result-address {
      display: block;
      margin-top: 4px;
      color: #888;
      font-size: 14px;
      line-height: 1.3;
      word-break: break-all;
    }

    .arrow-right {
      width: 8px;
      height: 8px;
      border-right: 2px solid #c0c0c0;
      border-top: 2px solid #c0c0c0;
      transform: rotate(45deg);
      flex-shrink: 0;
      margin-left: 8px;
    }

    /* 快速定位气泡浮窗 */
    .quick-locate-bubble {
      position: relative;
      margin: 0 14px 12px;
      background: #3a3f4c;
      border-radius: 8px;
      padding: 12px 14px;
    }

    /* 气泡顶部小三角 - 靠左 */
    .quick-locate-bubble::before {
      content: "";
      position: absolute;
      top: -8px;
      left: 40px;
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-bottom: 8px solid #3a3f4c;
    }

    .quick-locate-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .quick-locate-name {
      flex: 1;
      font-size: 15px;
      color: #fff;
      font-weight: 500;
      line-height: 1.4;
    }

    .quick-locate-close {
      width: 18px;
      height: 18px;
      position: relative;
      flex-shrink: 0;
      margin-left: 10px;
      cursor: pointer;
    }

    .quick-locate-close::before,
    .quick-locate-close::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 14px;
      height: 2px;
      background: #9fa3ab;
      border-radius: 1px;
    }

    .quick-locate-close::before {
      transform: translate(-50%, -50%) rotate(45deg);
    }

    .quick-locate-close::after {
      transform: translate(-50%, -50%) rotate(-45deg);
    }

    .door-input {
      min-height: 52px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      border-top: 1px solid var(--line);
    }

    .door-input input {
      width: 100%;
      height: 40px;
      border: 0;
      background: transparent;
      color: #333;
      font-size: 15px;
      outline: 0;
    }

    .door-input input::placeholder {
      color: var(--muted);
    }

    .form {
      background: transparent;
      position: relative;
      z-index: 1;
    }

    .info-card {
      background: #fff;
      margin: 12px 10px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .06);
    }

    .info-row {
      min-height: 52px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      gap: 12px;
    }

    .info-row:last-child {
      border-bottom: 0;
    }

    .info-label {
      font-size: 15px;
      color: #333;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .info-row input {
      flex: 1;
      width: 100%;
      outline: 0;
      color: #333;
      padding: 0;
      background: none;
      border: 0;
      font-size: 15px;
    }

    .info-row input::placeholder {
      color: var(--muted);
      opacity: 1;
    }

    .row {
      min-height: 52px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding: 0 10px;
      color: var(--muted);
      font-size: 15px;
      letter-spacing: .1px;
    }

    .row input {
      width: 100%;
      outline: 0;
      color: #333;
      padding: 0;
    }

    .row input::placeholder {
      color: var(--muted);
      opacity: 1;
    }

    .address-row {
      justify-content: space-between;
      gap: 12px;
      position: relative;
      text-align: left;
      width: 100%;
    }

    .address-row::before {
      content: "获取精准地址";
      position: absolute;
      right: 11px;
      top: -22px;
      padding: 3px 8px 4px;
      border-radius: 2px;
      background: #555;
      color: #fff;
      font-size: 13px;
      white-space: nowrap;
      line-height: 1.25;
    }

    .address-row::after {
      content: "";
      position: absolute;
      right: 28px;
      top: 1px;
      border: 7px solid transparent;
      border-top-color: #555;
    }

    .address-row.has-address {
      min-height: 68px;
      color: #333;
    }

    .address-row.has-address::before,
    .address-row.has-address::after {
      display: none;
    }

    .address-text {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      line-height: 21px;
      text-overflow: ellipsis;
    }

    .locate {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #b8b8b8;
      font-size: 15px;
      padding-right: 4px;
      white-space: nowrap;
    }

    .pin {
      width: 15px;
      height: 15px;
      border: 1.6px solid #d1d1d1;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      position: relative;
    }

    .pin::before {
      content: "";
      position: absolute;
      left: 4px;
      top: 4px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #d1d1d1;
    }

    .paste-wrap {
      padding: 12px 10px 12px;
      background: #eee;
    }

    .paste-card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .06);
      overflow: hidden;
    }

    .paste-box-inner {
      height: 141px;
      border: 1px solid #ddd;
      position: relative;
      padding: 13px 14px;
      color: #c9c9c9;
      font-size: 14px;
      line-height: 1.75;
      margin: 8px;
    }

    .paste-box p { margin: 0; }

    .recognize {
      position: absolute;
      right: 14px;
      bottom: 8px;
      width: 50px;
      height: 29px;
      border-radius: 3px;
      background: var(--red);
      color: rgba(255, 255, 255, .62);
      font-size: 13px;
    }

    .notice {
      display: flex;
      align-items: center;
      padding: 8px 14px;
      margin: 0;
      color: #999;
      font-size: 12px;
      line-height: 1.5;
    }

    .default-row {
      height: 95px;
      display: flex;
      justify-content: center;
      align-items: start;
      gap: 8px;
      padding-top: 27px;
      background: #eee;
      font-size: 15px;
      font-weight: 650;
      color: #222;
    }

    .radio {
      width: 21px;
      height: 21px;
      border-radius: 50%;
      border: 1.5px solid #c8c8c8;
      background: #fff;
    }

    .save {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 86px;
      height: 47px;
      background: var(--save);
      color: #fff;
      font-size: 15px;
      letter-spacing: 1px;
    }

    .browser-bottom {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 86px;
      background: #1d1d1d;
      display: flex;
      align-items: start;
      justify-content: center;
      gap: 72px;
      padding-top: 23px;
      z-index: 4;
    }

    .nav-arrow {
      width: 18px;
      height: 18px;
      border-left: 2px solid #9b9b9b;
      border-bottom: 2px solid #9b9b9b;
    }

    .nav-arrow.left { transform: rotate(45deg); }
    .nav-arrow.right {
      opacity: .42;
      transform: rotate(225deg);
    }

    .address-picker {
      background: #fff;
    }

    .search-panel {
      height: 74px;
      display: grid;
      grid-template-columns: 92px 1fr;
      align-items: center;
      gap: 0;
      padding: 10px 10px 11px;
      background: #fff;
      border-bottom: 1px solid #eee;
      position: relative;
      z-index: 3;
    }

    .city-trigger {
      height: 42px;
      display: flex;
      align-items: center;
      gap: 7px;
      color: #747474;
      font-size: 16px;
    }

    .down {
      width: 8px;
      height: 8px;
      border-right: 1.5px solid #777;
      border-bottom: 1.5px solid #777;
      transform: rotate(45deg) translateY(-3px);

    const formView = document.getElementById("formView");
    const addressView = document.getElementById("addressView");
    const cityView = document.getElementById("cityView");
    const pickerCity = document.getElementById("pickerCity");
    const currentCity = document.getElementById("currentCity");

    // 模式切换
    const modeTabs = document.querySelectorAll(".mode-tab");
    const manualMode = document.getElementById("manualMode");
    const mapMode = document.getElementById("mapMode");
    const modeBadge = document.querySelector(".mode-badge");

    modeTabs.forEach(tab => {
      tab.addEventListener("click", () => {
        modeTabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        const mode = tab.dataset.mode;
        manualMode.classList.toggle("active", mode === "manual");
        mapMode.classList.toggle("active", mode === "map");
        // 只有手动填写tab激活时才显示"更准确"气泡
        modeBadge.style.display = mode === "manual" ? "inline-block" : "none";
      });
    });

    // 地图选点模式
    const mapAddressTrigger = document.getElementById("mapAddressTrigger");
    const mapAddressText = document.getElementById("mapAddressText");

    mapAddressTrigger.addEventListener("click", () => {
      show(addressView);
    });

    function show(view) {
      cityView.classList.remove("active");
      [formView, addressView].forEach((item) => item.classList.remove("active"));
      view.classList.add("active");
    }

    document.getElementById("addressBack").addEventListener("click", () => show(formView));
    document.getElementById("cityTrigger").addEventListener("click", () => cityView.classList.add("active"));
    document.getElementById("cityBack").addEventListener("click", () => cityView.classList.remove("active"));

    // 地图选取：选择地址后返回
    document.querySelectorAll(".place-item").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".place-item").forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        const name = button.querySelector(".place-name").textContent;
        const addr = button.querySelector(".place-address").textContent;
        const province = pickerCity.textContent;
        setMapAddress(name, province + "市" + addr);
        show(formView);
      });
    });

    // 城市选择
    document.querySelectorAll("[data-city]").forEach((button) => {
      button.addEventListener("click", () => {
        const city = button.dataset.city;
        pickerCity.textContent = city;
        currentCity.textContent = city;
        cityView.classList.remove("active");
      });
    });

    // === 手动填写：地区选择弹窗 ===
    const regionPicker = document.getElementById("regionPicker");
    const regionText = document.getElementById("regionText");

    const regionCancel = document.getElementById("regionCancel");
    const regionConfirm = document.getElementById("regionConfirm");
    const provinceList = document.getElementById("provinceList");
    const cityList = document.getElementById("cityList");
    const districtList = document.getElementById("districtList");

    let selectedProvince = null;
    let selectedCity = null;
    let selectedDistrict = null;

    const regionData = {
      "广东省": {
        "深圳市": ["南山区", "福田区", "龙华区", "宝安区", "罗湖区", "龙岗区"],
        "广州市": ["天河区", "越秀区", "海珠区", "荔湾区", "白云区"]
      },
      "北京市": {
        "北京市": ["朝阳区", "海淀区", "东城区", "西城区", "丰台区"]
      },
      "上海市": {
        "上海市": ["浦东新区", "黄浦区", "静安区", "徐汇区", "长宁区"]
      },
      "浙江省": {
        "杭州市": ["西湖区", "上城区", "拱墅区", "滨江区"],
        "宁波市": ["海曙区", "江北区", "北仑区", "镇海区"]
      },
      "江苏省": {
        "南京市": ["玄武区", "秦淮区", "建邺区", "鼓楼区", "浦口区"],
        "苏州市": ["姑苏区", "虎丘区", "吴中区", "相城区"]
      }
    };

    function renderProvince() {
      provinceList.innerHTML = "";
      Object.keys(regionData).forEach(prov => {
        const el = document.createElement("div");
        el.className = "region-option" + (selectedProvince === prov ? " active" : "");
        el.textContent = prov;
        el.addEventListener("click", () => {
          selectedProvince = prov;
          selectedCity = null;
          selectedDistrict = null;
          renderProvince();
          renderCity();
          districtList.innerHTML = "";
        });
        provinceList.appendChild(el);
      });
    }

    function renderCity() {
      cityList.innerHTML = "";
      if (!selectedProvince || !regionData[selectedProvince]) return;
      Object.keys(regionData[selectedProvince]).forEach(city => {
        const el = document.createElement("div");
        el.className = "region-option" + (selectedCity === city ? " active" : "");
        el.textContent = city;
        el.addEventListener("click", () => {
          selectedCity = city;
          selectedDistrict = null;
          renderCity();
          renderDistrict();
        });
        cityList.appendChild(el);
      });
    }

    function renderDistrict() {
      districtList.innerHTML = "";
      if (!selectedProvince || !selectedCity || !regionData[selectedProvince][selectedCity]) return;
      regionData[selectedProvince][selectedCity].forEach(district => {
        const el = document.createElement("div");
        el.className = "region-option" + (selectedDistrict === district ? " active" : "");
        el.textContent = district;
        el.addEventListener("click", () => {
          selectedDistrict = district;
          renderDistrict();
        });
        districtList.appendChild(el);
      });
    }

    regionPicker.addEventListener("click", () => {
      renderProvince();
      if (selectedProvince) { renderCity(); }
      if (selectedCity) { renderDistrict(); }
      regionOverlay.classList.add("active");
    });

    regionCancel.addEventListener("click", () => {
      regionOverlay.classList.remove("active");
    });

    regionConfirm.addEventListener("click", () => {
      if (selectedProvince && selectedCity && selectedDistrict) {
        regionText.textContent = selectedProvince + " " + selectedCity + " " + selectedDistrict;
        regionText.classList.add("selected");
      }
      regionOverlay.classList.remove("active");
    });

    regionOverlay.addEventListener("click", (e) => {
      if (e.target === regionOverlay) regionOverlay.classList.remove("active");
    });

    // === 快速定位气泡浮窗 ===
    const quickLocateBubble = document.getElementById("quickLocateBubble");
    const quickLocateItem = document.getElementById("quickLocateItem");
    const quickLocateClose = quickLocateBubble.querySelector(".quick-locate-close");

    function setMapAddress(landmark, address) {
      mapAddressText.innerHTML = `
        <span class="map-result-name">${landmark}</span>
        <span class="map-result-address">${address}</span>
      `;
    }

    // 点击地标名称 → 填入地址框
    quickLocateItem.addEventListener("click", (e) => {
      if (e.target.closest(".quick-locate-close")) return;
      setMapAddress("龙华区数字创新中心", "广东省深圳市龙华区民塘路与白松路交叉口东60米");
      quickLocateBubble.style.display = "none";
    });

    // 点击关闭按钮 → 关闭气泡
    quickLocateClose.addEventListener("click", (e) => {
      e.stopPropagation();
      quickLocateBubble.style.display = "none";
    });
  </script>
</body>
</html>
